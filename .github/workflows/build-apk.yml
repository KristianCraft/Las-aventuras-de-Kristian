name: Construir APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Horizontal y pantalla completa
        run: |
          sed -i 's/<activity$/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' android/app/src/main/res/values/styles.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk juego.apk
          gh release create "apk-v${{ github.run_number }}" juego.apk --title "APK Android v${{ github.run_number }}" --notes "APK de Las aventuras de Kristian"
